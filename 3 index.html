<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>郭依琳 — 生日快乐</title>

  <!-- 字体：Inter（UI）+ Noto Sans SC（中文）-->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- GSAP 与 Draggable（通过 CDN，引入保证 60fps 动效） -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/Draggable.min.js"></script>

  <style>
    /* 主题变量：高阶版低饱和粉紫 + 金色点缀 */
    :root{
      --bg-1: #fbf7fb;
      --bg-2: #fff9fb;
      --panel: rgba(255,255,255,0.86);
      --grad-a: #f3dbea;
      --grad-b: #e9d7f0;
      --accent: #ff7ba4;
      --gold: #f0c06b;
      --soft: rgba(255,105,180,0.08);
      --shadow-lg: 0 30px 80px rgba(42,24,32,0.12);
      --shadow-md: 0 12px 34px rgba(42,24,32,0.08);
      --text: #2b1f23;
      --muted: #6b575e;
      --glass: rgba(255,255,255,0.6);
      --glass-border: rgba(255,255,255,0.8);
      --radius: 16px;
      --max-width: 520px;
    }

    /* 基础与强制触摸行为 */
    *{box-sizing:border-box}
    html,body{
      height:100vh;
      width:100vw;
      margin:0;
      padding:0;
      -webkit-text-size-adjust:100%;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(255,230,245,0.18), transparent 8%),
        radial-gradient(1000px 500px at 95% 90%, rgba(240,200,120,0.06), transparent 10%),
        linear-gradient(180deg,var(--bg-1), var(--bg-2));
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", sans-serif;
      color:var(--text);
      overflow:hidden;
      touch-action:none; /* 防止浏览器默认手势 */
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* 舞台: perspective for 3D feeling */
    .wrap{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      perspective: 1200px;
      -webkit-perspective: 1200px;
    }

    /* 封面（更大气的 Hero） */
    .cover{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background: linear-gradient(135deg,var(--grad-a),var(--grad-b));
      z-index:120;
      will-change:transform,opacity;
      box-shadow: var(--shadow-lg);
      padding:40px 20px;
      text-align:center;
      gap:18px;
    }
    .cover h1{
      color:#fff;
      font-size:2.6rem;
      letter-spacing:0.02em;
      margin:0;
      line-height:1.02;
      font-weight:700;
      text-shadow: 0 12px 30px rgba(0,0,0,0.12);
      font-family: "Noto Sans SC", "Inter", serif;
      transform: translateZ(40px) scale(1.01);
    }
    .cover p{
      color: rgba(255,255,255,0.94);
      font-size:1rem;
      max-width:640px;
      margin:0;
      opacity:0.95;
    }
    .cta{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-top:8px;
      background:linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border-radius:14px;
      padding:10px 14px;
      color:white;
      cursor:pointer;
      box-shadow: 0 8px 30px rgba(255,115,160,0.08);
      transition: transform .2s ease, box-shadow .2s ease;
      border: 1px solid rgba(255,255,255,0.12);
      user-select:none;
    }
    .cta:active{ transform: translateY(2px) scale(0.995) }
    .cta .arrow{
      width:34px;height:34px;border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
      display:flex;align-items:center;justify-content:center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      transform:translateY(0);
    }
    .cta .arrow::after{
      content:''; border:7px solid transparent; border-top-color:white; display:block; transform:translateY(-3px);
    }

    /* 场景: 更大气的居中容器 */
    .scene{
      position:absolute;
      inset:0;
      display:block;
      z-index:10;
      pointer-events:auto;
      will-change:transform,opacity;
      transform: translateY(100%);
      transform-style:preserve-3d;
    }

    /* 桌子 */
    .table-wrap{
      position:absolute;
      left:50%;
      bottom:6%;
      transform:translateX(-50%);
      width:92%;
      max-width:var(--max-width);
      height:180px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      pointer-events:none;
    }
    .table{
      width:100%;
      height:140px;
      background: linear-gradient(180deg,#d6b58c,#caa57d);
      border-radius:20px;
      box-shadow: var(--shadow-md);
      position:relative;
      overflow:visible;
      filter:drop-shadow(0 14px 40px rgba(0,0,0,0.08));
      pointer-events:auto;
    }
    .table::before{
      content:'';
      position:absolute;left:0;right:0;top:10px;height:30%;
      background:linear-gradient(90deg, rgba(255,255,255,0.03) 0%, transparent 30%, rgba(0,0,0,0.04) 100%);
      mix-blend-mode:overlay;
      border-radius:inherit;
    }

    /* 蛋糕容器：更细腻的分层与金属光泽盘 */
    .cake-wrap{
      position:absolute;
      left:50%;
      top:-78px;
      transform:translateX(-50%);
      width:220px;
      height:260px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      pointer-events:auto;
      will-change:transform;
      transform-style:preserve-3d;
    }
    .plate{
      position:absolute;
      bottom:-28px;
      left:50%;
      transform:translateX(-50%);
      width:260px;
      height:40px;
      background: linear-gradient(180deg, #fffefc, #fff3d6);
      border-radius:50%;
      box-shadow: 0 10px 30px rgba(38,22,18,0.08), inset 0 -6px 10px rgba(0,0,0,0.03);
      z-index:8;
      border:1px solid rgba(255,255,255,0.6);
    }

    .cake{
      position:relative;
      width:180px;
      height:170px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      z-index:10;
      pointer-events:auto;
      will-change:transform;
      transform-origin:center bottom;
    }
    .layer{
      width:150px;
      height:52px;
      border-radius: 50% 50% 14px 14px;
      margin-bottom:8px;
      position:relative;
      transform-origin:center bottom;
      box-shadow: 0 10px 32px var(--soft);
      overflow:hidden;
      background: linear-gradient(180deg,#ff8fc0,#ff7aa5);
      transition: transform .45s ease, opacity .45s ease;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .layer:nth-child(2){ width:130px; height:44px; background: linear-gradient(180deg,#ff9fc7,#ff88b2); z-index:9; }
    .layer:nth-child(3){ width:110px; height:38px; background: linear-gradient(180deg,#ffb7d6,#ffa2c6); z-index:8; }

    /* 蜡烛：更细腻火焰（两个层级） */
    .candle{
      position:absolute;
      bottom:142px;
      left:50%;
      transform:translateX(-50%);
      width:14px;height:46px;
      background: linear-gradient(180deg,#fff,#f4f2f2);
      border-radius:8px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08), inset 0 -6px 10px rgba(0,0,0,0.02);
      z-index:22;
      will-change:transform;
    }
    .candle::after{
      /* 蜡滴装饰 */
      content:''; position:absolute; left:50%; transform:translateX(-50%); top:6px; width:6px; height:8px; background:rgba(255,245,250,0.9); border-radius:4px;
    }
    .flame{
      position:absolute;
      bottom:42px;
      left:50%;
      transform:translateX(-50%) translateZ(30px);
      width:20px;height:30px;
      background: radial-gradient(circle at 42% 30%, #ffd866, #ff9b50 60%);
      border-radius:50% 50% 40% 40%;
      box-shadow: 0 10px 30px rgba(255,160,200,0.28);
      will-change:transform,opacity,filter;
      filter: drop-shadow(0 12px 30px rgba(255,160,200,0.24));
    }
    .flame::after{
      content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:6px; width:10px; height:14px; background: radial-gradient(circle at 40% 30%, #fff3a2, #ffb36b 70%); border-radius:50%;
      filter: blur(0.6px);
    }

    /* Q版女生：更高级的精细化（阴影与材质） */
    .girl{
      position:absolute;
      left:14%;
      bottom:16%;
      width:80px;
      height:110px;
      z-index:50;
      cursor:grab;
      will-change:transform,box-shadow;
      user-select:none;
      touch-action:none;
      -webkit-tap-highlight-color: transparent;
      transform-style:preserve-3d;
    }
    .girl .body{
      position:absolute;
      left:0;right:0;bottom:0;
      height:82px;
      margin:auto;
      width:80px;
      border-radius:20px 20px 14px 14px;
      background: linear-gradient(180deg,#ffdfe8,#ffbfd1);
      box-shadow: 0 18px 46px rgba(0,0,0,0.10);
      display:flex;align-items:flex-start;justify-content:center;
      padding-top:10px;
    }
    .girl .face{
      width:50px;height:50px;border-radius:50%;
      background: #ffebd9; position:relative; top:-12px; box-shadow:0 10px 20px rgba(0,0,0,0.06);
      border:1px solid rgba(0,0,0,0.03);
    }
    .hair{
      position:absolute;left:8px;top:-4px;width:64px;height:30px;border-radius:50% 50% 20% 20%;background:#58321f;
      box-shadow: inset 0 -8px 14px rgba(0,0,0,0.06);
    }
    .eye{position:absolute;top:18px;width:7px;height:7px;background:#2b1f23;border-radius:50%}
    .eye.left{left:14px}
    .eye.right{right:14px}
    .mouth{
      position:absolute;left:50%;bottom:12px;width:16px;height:9px;border-bottom:2px solid #58321f;border-radius:0 0 16px 16px;transform:translateX(-50%);
      transition: all 160ms;
      background:transparent;
    }

    /* 信封（从盘底弹出，视觉升级） */
    .envelope{
      position:absolute;
      bottom: -36px;
      left:50%;
      transform:translateX(-50%) translateY(18px);
      width:138px;height:84px;background: linear-gradient(180deg,#fff9f2,#fff2dc);
      border-radius:12px;
      box-shadow: 0 12px 36px rgba(32,20,20,0.12);
      opacity:0; z-index:12; pointer-events:auto;
      display:flex;align-items:center;justify-content:center;
      will-change:transform,opacity;
      border:1px solid rgba(255,255,255,0.6);
      cursor:pointer;
    }
    .envelope:focus{ outline: 3px solid rgba(255,123,164,0.12); outline-offset:6px }
    .envelope .label{ font-weight:700; color:var(--muted); font-size:.94rem; }

    .envelope::before{
      content:'';position:absolute;left:10px;right:10px;top:16px;height:0;border-top:26px solid rgba(255,255,255,0.78);border-left:26px solid transparent;border-right:26px solid transparent;border-radius:2px; mix-blend-mode: overlay;
    }

    /* 信件弹层（升级为玻璃卡片 + serif 字体） */
    .letter{
      position:absolute;inset:0;background: linear-gradient(180deg, rgba(255,248,251,0.6), rgba(255,245,249,0.7));
      display:flex;align-items:center;justify-content:center;z-index:220;backdrop-filter: blur(6px);
      opacity:0; pointer-events:none;
    }
    .letter .card{
      width:88%;max-width:520px;background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,252,250,0.96));
      border-radius:18px;padding:26px 22px;box-shadow:0 30px 80px rgba(30,18,18,0.12);
      transform:scale(0.96);opacity:0;will-change:transform,opacity;
      border:1px solid rgba(240,220,200,0.12);
      font-family: "Noto Sans SC", "Inter", sans-serif;
    }
    .letter .line{ font-size:1.05rem;color:var(--text);line-height:1.9; margin-bottom:12px; opacity:0; transform: translateY(8px); }
    .letter .date{ margin-top:20px;color:var(--accent);font-weight:700; text-align:right; font-size:.98rem }

    /* 粒子容器 */
    .particles, .letter-particles{ position:absolute; inset:0; pointer-events:none; z-index:210; overflow:visible; }
    .particle{
      position:absolute;width:12px;height:12px;border-radius:6px; opacity:0; will-change:transform,opacity;
      mix-blend-mode: screen;
    }

    /* 小屏/适配 */
    @media (max-width:420px){
      .cover h1{font-size:1.9rem}
      .girl{width:64px;height:92px; left:12%}
      .cake-wrap{width:170px;height:210px; top:-64px}
      .table-wrap{height:150px}
      .plate{width:200px}
    }

    /* prefers-reduced-motion: 关闭多余动画 */
    @media (prefers-reduced-motion: reduce) {
      .flame, .particle, .cake, .scene, .cover * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <!-- 封面 -->
    <div class="cover" id="cover" role="region" aria-label="封面">
      <h1>致 最爱的 依琳</h1>
      <p>愿这一天被温柔、惊喜与甜蜜填满。轻触或上滑以开启祝福。</p>
      <div class="cta" id="openBtn" role="button" tabindex="0" aria-label="开启祝福">
        <div class="arrow" aria-hidden="true"></div>
        <div style="font-weight:600">上滑 / 点击 开始</div>
      </div>
    </div>

    <!-- 场景 -->
    <div class="scene" id="scene" aria-hidden="true">
      <div class="table-wrap">
        <div class="table" id="table">
          <div class="cake-wrap" id="cakeWrap">
            <div class="plate" aria-hidden="true"></div>
            <div class="cake" id="cake" aria-hidden="true">
              <div class="layer" id="layer1" aria-hidden="true"></div>
              <div class="layer" id="layer2" aria-hidden="true"></div>
              <div class="layer" id="layer3" aria-hidden="true"></div>
            </div>
            <div class="candle" id="candle" aria-hidden="true">
              <div class="flame" id="flame" aria-hidden="true"></div>
            </div>
            <div class="envelope" id="envelope" role="button" aria-label="打开信封" tabindex="0"><div class="label">打开</div></div>
          </div>
        </div>
      </div>

      <!-- 女生 -->
      <div class="girl" id="girl" role="button" aria-label="拖动我" tabindex="0">
        <div class="hair" aria-hidden="true"></div>
        <div class="body">
          <div class="face" aria-hidden="true">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth" id="mouth"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 信件弹层 -->
    <div class="letter" id="letter">
      <div class="letter-particles" id="letterParticles" aria-hidden="true"></div>
      <div class="card" id="letterCard" role="dialog" aria-modal="true" aria-hidden="true">
        <!-- 文本将由 JS 注入并做 stagger 动画 -->
        <div id="letterLines"></div>
        <div class="date">20070723 ♡</div>
      </div>
    </div>

    <!-- 全局粒子层（场景级） -->
    <div class="particles" id="particles" aria-hidden="true"></div>
  </div>

  <script>
    /***************************************
     * 交互逻辑（增强版）
     * - 保留原有 GSAP + Draggable 核心流程
     * - 增加视差、更精致火焰、inertia（可选）、键盘无障碍控制、节流和资源清理
     ***************************************/
    (function(){
      // DOM 节点
      const cover = document.getElementById('cover');
      const openBtn = document.getElementById('openBtn');
      const scene = document.getElementById('scene');
      const girl = document.getElementById('girl');
      const flame = document.getElementById('flame');
      const candle = document.getElementById('candle');
      const cake = document.getElementById('cake');
      const layers = [document.getElementById('layer1'), document.getElementById('layer2'), document.getElementById('layer3')];
      const envelope = document.getElementById('envelope');
      const letter = document.getElementById('letter');
      const letterCard = document.getElementById('letterCard');
      const letterLines = document.getElementById('letterLines');
      const particles = document.getElementById('particles');
      const letterParticles = document.getElementById('letterParticles');
      const mouth = document.getElementById('mouth');
      const wrap = document.getElementById('wrap');

      // 状态
      let startY = 0;
      let isBlown = false;
      let eatingStep = 0; // 0..3
      let draggableInst = null;
      let coverOpened = false;
      let letterParticleTimer = null;

      // 防抖 / 节流
      function throttle(fn, wait=120){
        let last=0;
        return function(...args){
          const now=Date.now();
          if(now-last>wait){ last=now; fn.apply(this,args); last=now; }
        }
      }

      /* ---------------------------
         封面：点击或上滑均可开启
         --------------------------- */
      openBtn.addEventListener('click', openCover);
      openBtn.addEventListener('touchend', function(e){ e.preventDefault(); openCover(); }, {passive:false});
      openBtn.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCover(); }
      });

      cover.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startY = e.touches[0].clientY;
      }, {passive:false});
      cover.addEventListener('touchend', (e) => {
        const endY = e.changedTouches[0].clientY;
        const diff = startY - endY;
        if(diff > 50 && !coverOpened){
          openCover();
        }
      }, {passive:false});

      function openCover(){
        if(coverOpened) return;
        coverOpened = true;
        const tl = gsap.timeline({
          defaults:{duration:0.82, ease:'power3.inOut'}
        });
        // 封面上移并淡出
        tl.to(cover, { y:'-120%', opacity:0, duration:0.9, ease:'power3.in' });
        // 场景弹入与轻微透视
        tl.to(scene, { y:'0%', duration:1.0, ease:'elastic.out(1,0.72)', onStart:()=> {
          scene.style.transform = 'translateY(100%)';
          scene.setAttribute('aria-hidden','false');
        } }, '-=0.6');
        tl.add(() => {
          cover.style.display='none';
          initializeDraggable();
          initTouchPrevention();
          enableParallax();
        }, '>-0.1');
      }

      /* ---------------------------
         Draggable 初始化：女生可拖拽，启用 smooth inertia（更丝滑）
         --------------------------- */
      function initializeDraggable(){
        // bounds 根据视窗计算，留出安全区域
        const boundPadding = 12;
        function getBounds(){
          return {
            minX: boundPadding,
            maxX: window.innerWidth - girl.offsetWidth - boundPadding,
            minY:  Math.max(24, window.innerHeight*0.06),
            maxY: window.innerHeight - girl.offsetHeight - 22
          };
        }
        if(window.gsap && window.Draggable){
          // 若设备支持 reduce-motion 则关闭 inertia
          const inertia = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          draggableInst = Draggable.create(girl, {
            type:'x,y',
            bounds:getBounds(),
            edgeResistance:0.8,
            inertia: inertia,
            overshootTolerance: 0.6,
            onPress:function(){
              gsap.to(girl, { scale:1.06, boxShadow:'0 22px 48px rgba(0,0,0,0.16)', duration:0.18 });
            },
            onDrag: throttle(function(){
              checkProximityDuringDrag();
            }, 80),
            onRelease:function(){
              gsap.to(girl, { scale:1, duration:0.45, ease:'back.out(3)' });
              checkProximityDuringDrag(true);
            },
            onThrowUpdate:function(){ checkProximityDuringDrag(); }
          })[0];
        }
        // 让 cake 轻轻呼吸
        gsap.to(cake, { y:-6, duration:3.0, yoyo:true, repeat:-1, ease:'sine.inOut' });
      }

      /* ---------------------------
         视差（鼠标/触摸）以增强空间感
         --------------------------- */
      function enableParallax(){
        const move = throttle((e) => {
          const rect = wrap.getBoundingClientRect();
          let x = (e.clientX ?? (e.touches && e.touches[0].clientX) ?? rect.width/2) - rect.left;
          let y = (e.clientY ?? (e.touches && e.touches[0].clientY) ?? rect.height/2) - rect.top;
          const cx = rect.width/2, cy = rect.height/2;
          const dx = (x - cx) / cx;
          const dy = (y - cy) / cy;
          // subtle transforms for depth
          gsap.to(scene, { rotationY: dx * 2.6, rotationX: dy * -2, duration:0.9, ease:'power2.out' });
          gsap.to(cake, { x: dx * -6, y: -6 + dy * 6, duration:1.2, ease:'power3.out' });
          gsap.to(girl, { x: dx * 10, y: dy * 6, duration:1.2, ease:'power3.out' });
        }, 50);

        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive:true});
      }

      /* ---------------------------
         吹蜡烛与距离检测（拖动中和释放时都检测）
         --------------------------- */
      function getCenterRect(el){
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width/2, y: r.top + r.height/2 };
      }

      const checkProximityDuringDrag = throttle((onRelease=false) => {
        if(isBlown) {
          if(eatingStep < 3 && isNear(girl, cake, 78)){
            tryStartEating();
          }
          return;
        }
        if(isNear(girl, candle, 56)){
          blowCandle();
        }
      }, 100);

      function isNear(a, b, threshold=60){
        const c1 = getCenterRect(a);
        const c2 = getCenterRect(b);
        const d = Math.hypot(c1.x - c2.x, c1.y - c2.y);
        return d < threshold;
      }

      function blowCandle(){
        if(isBlown) return;
        isBlown = true;
        // 火焰消失（更有层次） + 嘴型变化 + 细腻烟雾
        gsap.to(flame, { scale:0.5, opacity:0, duration:0.6, ease:'power2.out' });
        gsap.fromTo(flame, { filter:'blur(0px)' }, { filter:'blur(6px)', duration:0.9 });
        gsap.to(mouth, { height:16, borderBottom:'none', borderTop:'3px solid #58321f', borderRadius:'12px 12px 0 0', duration:0.18 });
        createSmokeEffect(getCenterRect(girl));
      }

      /* ---------------------------
         吃蛋糕逻辑（3 次咬合，联动信封显现）
         --------------------------- */
      function tryStartEating(){
        if(!isBlown) return;
        if(eatingStep >= 3) return;
        eatingStep++;
        const cakeCenter = getCenterRect(cake);
        const girlCenter = getCenterRect(girl);
        const dx = cakeCenter.x - girlCenter.x;
        const dy = (cakeCenter.y - girlCenter.y) - 18;

        const tl = gsap.timeline();
        tl.to(girl, { x: `+=${dx}`, y: `+=${dy}`, duration:0.62, ease:'power2.out' });
        tl.to(mouth, { scaleY:0.78, duration:0.08, repeat:6, yoyo:true, transformOrigin:'center center' }, '-=0.08');
        const targetLayer = layers[3 - eatingStep];
        tl.to(targetLayer, { scaleY:0, transformOrigin:'center bottom', duration:0.6, ease:'power3.in' }, '-=0.45');
        tl.to(envelope, { opacity: Math.min(1, eatingStep/3), y: `${18 - eatingStep*6}px`, duration:0.62, ease:'power2.out' }, '-=0.6');
        tl.add(() => {
          if(eatingStep >= 3){
            gsap.to(cake, { scale:0.98, opacity:0, duration:0.6, ease:'power2.inOut' });
            gsap.to(envelope, { y:0, duration:0.72, ease:'elastic.out(1,0.6)' });
            envelope.style.pointerEvents = 'auto';
            envelope.setAttribute('tabindex','0');
          } else {
            gsap.to(girl, { x: `-=${dx*0.18}`, y:`-=${dy*0.18}`, duration:0.62, ease:'elastic.out(1,0.6)' });
          }
        }, '>');
      }

      /* ---------------------------
         信封点击：镜头拉近 & 信件弹出
         --------------------------- */
      envelope.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
      envelope.addEventListener('click', openEnvelope);
      envelope.addEventListener('touchend', function(e){ e.preventDefault(); openEnvelope(); }, {passive:false});
      envelope.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });

      function openEnvelope(){
        if(eatingStep < 3) return;
        const sceneEl = scene;
        const envRect = envelope.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const wrapCenterX = envRect.left + envRect.width/2 - wrapRect.width/2;
        const tl = gsap.timeline({ defaults:{duration:0.85, ease:'power2.inOut'} });
        tl.to(sceneEl, { scale:1.45, y:'-8%', x: `-${wrapCenterX*0.46}px`, transformOrigin:'center center' });
        tl.to(letter, { opacity:1, pointerEvents:'auto', duration:0.36 }, '>-0.12');
        tl.to(letterCard, { scale:1, opacity:1, duration:0.62, ease:'elastic.out(1,0.6)' }, '>-0.12');
        tl.add(() => {
          showLetterText();
          startLetterParticles();
        });
      }

      /* ---------------------------
         文本 & 粒子：信件内容逐行淡入（staggerFrom）
         --------------------------- */
      const messageLines = [
        "亲爱的依琳，",
        "在这个属于你的日子里，想把所有温柔都送到你身边。",
        "愿你的笑容永远像今天一样明媚，愿未来的每一天都被爱包围。",
        "感谢你陪我走过的每一段时光，愿我们携手，共赴每一个明天。",
        "生日快乐，我最爱的依琳。"
      ];

      function showLetterText(){
        letterLines.innerHTML = '';
        messageLines.forEach((t, i) => {
          const div = document.createElement('div');
          div.className = 'line';
          div.textContent = t;
          letterLines.appendChild(div);
        });
        const lines = letterLines.querySelectorAll('.line');
        gsap.to(lines, { opacity:1, y:0, duration:0.72, stagger:0.16, ease:'power2.out' });
      }

      /* ---------------------------
         场景与信件粒子效果（更柔和更高质感）
         --------------------------- */
      function random(min,max){ return Math.random()*(max-min)+min; }

      function createSmokeEffect(center){
        for(let i=0;i<10;i++){
          const p = document.createElement('div');
          p.className = 'particle';
          p.style.left = (center.x - 8) + 'px';
          p.style.top = (center.y - 18) + 'px';
          const size = 8 + Math.random()*18;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.borderRadius = '50%';
          p.style.background = 'rgba(255,255,255,0.85)';
          p.style.opacity = 0.9;
          particles.appendChild(p);
          gsap.to(p, {
            x: random(-40,40),
            y: random(-110,-40),
            opacity:0,
            scale: random(0.9,1.8),
            duration:1.0 + Math.random()*0.7,
            ease:'power2.out',
            onComplete:()=> p.remove()
          });
        }
      }

      function startLetterParticles(){
        if(letterParticleTimer) return;
        letterParticleTimer = setInterval(()=> {
          const p = document.createElement('div');
          p.className = 'particle';
          const size = Math.floor(random(8,20));
          p.style.width = size+'px';
          p.style.height = size+'px';
          const isHeart = Math.random() > 0.5;
          p.style.left = random(12,88)+'%';
          p.style.top = '-8%';
          p.style.borderRadius = isHeart ? '6px' : '50%';
          if(isHeart){
            // 用旋转方块模拟心形视觉（节省 svg）
            p.style.background = 'linear-gradient(135deg, rgba(255,105,180,0.98), rgba(255,175,200,0.95))';
            p.style.transform = 'rotate(45deg)';
          } else {
            p.style.background = 'linear-gradient(90deg, rgba(255,235,165,0.98), rgba(255,195,110,0.95))';
          }
          p.style.opacity = 0.95;
          letterParticles.appendChild(p);
          gsap.to(p, {
            y: window.innerHeight*0.9 + random(30,220),
            rotation: random(-40,40),
            opacity:0,
            duration: 3.2 + Math.random()*1.8,
            ease:'power1.out',
            onComplete: ()=> p.remove()
          });
        }, 140);
      }

      /* ---------------------------
         阻止页面滚动（移动端）
         --------------------------- */
      function initTouchPrevention(){
        function prevent(e){ e.preventDefault(); }
        document.addEventListener('touchmove', prevent, {passive:false});
        document.addEventListener('gesturestart', prevent, {passive:false});
      }

      /* ---------------------------
         窗口尺寸变化处理（更新 draggable bounds）
         --------------------------- */
      window.addEventListener('resize', throttle(()=> {
        if(draggableInst && draggableInst.updateBounds){
          draggableInst.updateBounds();
        }
      }, 200));

      /* ---------------------------
         点击信件外部关闭
         --------------------------- */
      letter.addEventListener('click', function(e){
        if(e.target === letter){
          closeLetter();
        }
      });
      function closeLetter(){
        clearInterval(letterParticleTimer);
        letterParticleTimer = null;
        gsap.to(letter, { opacity:0, pointerEvents:'none', duration:0.36 });
        gsap.to(letterCard, { scale:0.96, opacity:0, duration:0.32 });
        gsap.to(scene, { scale:1, x:0, y:0, duration:0.6, ease:'power2.out' });
      }

      // 页面初始动画（微入场）
      gsap.from('.cover h1', { y:20, opacity:0, duration:0.86, ease:'power3.out' });
      gsap.from('.cover p', { y:12, opacity:0, duration:0.86, delay:0.06 });
      gsap.from('.cta', { y:18, opacity:0, duration:0.9, delay:0.12 });

      // 防止长按高亮（iOS）
      document.addEventListener('touchstart', function() {}, {passive:true});
    })();
  </script>
</body>
</html>
