<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>birthday-20070723 - 给郭依琳的生日祝福</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome for small icon (arrow) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="" crossorigin="anonymous"/>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>

  <style>
    /* ========== 基础布局与移动端适配 ==========
       - 仅适配移动端：隐藏在过宽或横屏时的遮罩
       - 禁止滚动、长按、选中、双击缩放
    */
    html,body{
      height:100%;
      background:#000;
      font-family: 'Inter', system-ui, -apple-system, "Helvetica Neue", "Noto Sans SC", "Microsoft Yahei", sans-serif;
      -webkit-user-select:none; user-select:none;
      -webkit-tap-highlight-color: transparent;
      margin:0; padding:0; overflow:hidden;
      touch-action: none; /* 全程触摸交互 */
    }

    /* 横屏或大屏遮罩 - 禁止PC和横屏 */
    #device-block {
      position:fixed; z-index:9999; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(180deg, rgba(0,0,0,0.85), rgba(10,10,10,0.95));
      color:#fff; padding:20px; text-align:center;
    }
    #device-block.hidden{ display:none; }

    /* 主容器 */
    #stage {
      position:fixed; inset:0; overflow:hidden;
      perspective:1200px;
      -webkit-perspective:1200px;
      background:linear-gradient(#00121a 0%, #001824 40%, #071b2a 100%);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* 三层容器: world (camera moves), table, foreground */
    .world {
      position:absolute; inset:0; transform-style:preserve-3d;
      will-change:transform;
    }

    /* 星夜背景层 */
    #stars {
      position:absolute; inset:0; z-index:1;
      overflow:hidden;
      background: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.02), transparent 8%),
                  radial-gradient(ellipse at 80% 80%, rgba(255,255,255,0.01), transparent 20%),
                  linear-gradient(180deg, rgba(7,15,25,0.6), rgba(1,6,12,0.85));
    }

    .star {
      position:absolute; width:2px; height:2px; background:#fff;
      border-radius:50%;
      opacity:0.9; transform:translateZ(0);
      filter:drop-shadow(0 0 6px rgba(255,255,255,0.6));
    }

    .shoot {
      position:absolute; width:2px; height:2px; background:linear-gradient(90deg,#fff,rgba(255,255,255,0)); border-radius:2px;
      opacity:0.9;
    }

    /* 浮层：标题与提示 */
    #intro {
      position:absolute; z-index:5; inset:0; display:flex; flex-direction:column; gap:18px;
      align-items:center; justify-content:center; pointer-events:auto;
      transform:translateZ(120px);
      color:#fff;
      text-align:center;
      padding:20px;
    }
    #intro h1{
      margin:0; font-size:2.2rem; letter-spacing:2px; font-weight:700;
      text-shadow:0 6px 30px rgba(0,0,0,0.6);
    }
    #intro .name{
      display:block; font-size:1.1rem; opacity:0.95; margin-top:4px; font-weight:600;
    }
    #intro .hint{
      margin-top:12px; font-size:0.95rem; opacity:0.9;
      display:flex; gap:8px; align-items:center; animation:breath 2.6s infinite;
      color:rgba(255,255,255,0.95);
    }
    @keyframes breath{
      0%{ transform: translateY(0) scale(1) }
      50%{ transform: translateY(-3px) scale(1.01) }
      100%{ transform: translateY(0) scale(1) }
    }

    .arrow-bob{
      font-size:1.6rem; animation:arrowUpDown 1.6s infinite;
      opacity:0.95;
    }
    @keyframes arrowUpDown{
      0%{ transform:translateY(0) }
      50%{ transform:translateY(8px) }
      100%{ transform:translateY(0) }
    }

    /* 木质桌子 */
    #table-wrap {
      position:absolute; left:50%; transform:translateX(-50%) translateY(20vh) translateZ(0);
      z-index:20; width:100%; max-width:540px; pointer-events:none;
      display:flex; align-items:flex-end; justify-content:center;
      will-change:transform;
    }
    #table {
      width:90%; max-width:420px; height:220px; border-radius:14px;
      background:linear-gradient(180deg,#6b4b32,#3f2a1f);
      box-shadow:0 40px 80px rgba(0,0,0,0.6), inset 0 -12px 24px rgba(0,0,0,0.2);
      transform-origin:center center;
      will-change:transform, filter;
    }
    /* 桌面上的物件容器 */
    #table-scene {
      position:absolute; z-index:25; left:50%; transform:translateX(-50%);
      bottom:calc(20vh + 20px); width:90%; max-width:420px; pointer-events:auto;
      display:flex; align-items:flex-end; justify-content:center;
    }

    /* 盘子与蛋糕 */
    #plate {
      width:240px; height:240px; border-radius:120px; background: radial-gradient(circle at 50% 35%, #fff, #f6f6f6 40%, #e7e7e7 100%);
      display:flex; align-items:center; justify-content:center; box-shadow:0 20px 40px rgba(0,0,0,0.35);
      position:relative; overflow:visible; transform-origin:center center;
      -webkit-backface-visibility:hidden;
    }

    /* 蛋糕容器 */
    #cake {
      width:180px; height:180px; position:relative; transform-origin:center bottom;
      will-change:transform, clip-path;
      touch-action:none;
    }

    /* 蛋糕层样式 (通过 svg 实现) */
    svg.cake-layer { display:block; }

    /* 女孩 (Q版) */
    #girl {
      position:absolute; right:18%; bottom:10%; width:120px; height:260px; z-index:30;
      transform-origin:50% 100%;
      touch-action:none;
      will-change:transform;
      cursor:grab;
    }
    #girl.dragging { cursor:grabbing; }

    /* 烟花与粒子层 */
    #effects {
      position:absolute; inset:0; z-index:40; pointer-events:none;
      overflow:visible;
    }

    /* 光照与 vignette */
    #vignette {
      position:absolute; inset:0; z-index:45; pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(255,240,230,0.02), rgba(8,10,12,0.65) 60%, rgba(0,0,0,0.9) 100%);
      mix-blend-mode:screen;
    }

    /* 信封与纸张 */
    .envelope {
      width:140px; height:90px; background:linear-gradient(180deg,#fff7ef,#fff5ec);
      border-radius:8px; box-shadow:0 18px 40px rgba(0,0,0,0.35);
      display:flex; align-items:center; justify-content:center; position:relative;
      transform-origin:center center; will-change:transform, opacity;
    }
    .envelope .flap {
      position:absolute; top:0; left:0; right:0; height:50%; background:linear-gradient(180deg,#ffeedd,#fff0e0);
      transform-origin:50% 0%; border-top-left-radius:8px; border-top-right-radius:8px;
    }
    .paper {
      width:120px; height:70px; background:linear-gradient(180deg,#fffdf9,#fff8f2);
      border-radius:6px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
      position:relative; padding:12px; font-size:12px; color:#222; line-height:1.3;
      transform-origin:center center; will-change:transform, opacity;
    }

    /* 文字排版 */
    .letter-title { font-weight:700; font-size:1rem; color:#b66b00; margin-bottom:6px; text-align:center }
    .letter-body { font-size:0.88rem; color:#333; white-space:pre-line; text-align:left }

    /* 最后署名 */
    .signature { text-align:center; margin-top:12px; font-weight:600; color:#8a3b3b }

    /* 小优化: will-change */
    #girl, #cake, #table, #plate { will-change:transform, opacity }

    /* 控件与提示的按键样式 */
    .btn {
      background:rgba(255,255,255,0.06); border-radius:12px; padding:8px 12px; color:#fff; font-weight:600;
      box-shadow:0 6px 18px rgba(0,0,0,0.4); backdrop-filter:blur(6px);
    }

    /* 适配提示在顶部占位，底部安全区 */
    .safe-bottom { padding-bottom:env(safe-area-inset-bottom, 12px); }

    /* 小屏/缩放约束 */
    @media (min-width:900px),(orientation:landscape) {
      #device-block{ display:flex }
      #stage{ display:none }
    }
  </style>

<script>
/*
  birthday-20070723.html
  作者注：本文件为单文件 H5 互动页面，面向移动端。
  实现说明与开发要点已在页面头部与外层说明中列出。
*/

/* ---------------------------
   全局配置与状态
   --------------------------- */
const state = {
  started: false,          // 用户首次交互，允许播放音频
  phase: 0,                // 0: intro, 1: raised table, 2: cake scene, 3: blown, 4: eating, 5: envelope opened
  canvas: null,
  ctx: null,
  particles: [],
  width: window.innerWidth,
  height: window.innerHeight,
  girlPos: { x: 0, y:0 },
  dragging: false,
  velocity: { x:0, y:0 },
  lastTouch: null,
  bites: 0,                // 吃蛋糕次数
  envelopeShown: false
};

/* ---------------------------
   设备检测（强制竖屏遮罩）
   --------------------------- */
function checkDevice(){
  const isLandscape = window.innerWidth > window.innerHeight;
  const block = document.getElementById('device-block');
  if(isLandscape || window.innerWidth > 900){
    block.classList.remove('hidden');
    document.getElementById('stage').style.display = 'none';
  } else {
    block.classList.add('hidden');
    document.getElementById('stage').style.display = 'block';
  }
}
checkDevice();
window.addEventListener('resize', ()=>{ state.width=innerWidth; state.height=innerHeight; checkDevice(); });

/* ---------------------------
   创建星空
   --------------------------- */
function createStars(count=80){
  const wrap = document.getElementById('stars');
  wrap.innerHTML='';
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className='star';
    const x = Math.random()*100;
    const y = Math.random()*100;
    const scale = Math.random()*1.6 + 0.4;
    s.style.left = x + '%';
    s.style.top = y + '%';
    s.style.width = (2*scale)+'px';
    s.style.height = (2*scale)+'px';
    s.style.opacity = (Math.random()*0.8+0.2).toFixed(2);
    s.style.transform = `scale(${scale})`;
    wrap.appendChild(s);
    // twinkle
    gsap.to(s, {opacity: Math.random()*0.7+0.3, duration: Math.random()*2+1.6, yoyo:true, repeat:-1, ease:'sine.inOut', delay:Math.random()*2});
  }
  // shooting stars
  setInterval(()=> spawnShootingStar(), 3000 + Math.random()*4000);
}
function spawnShootingStar(){
  const wrap = document.getElementById('stars');
  const s = document.createElement('div');
  s.className = 'shoot';
  s.style.left = Math.random()*70 + 10 + '%';
  s.style.top = Math.random()*40 + 5 + '%';
  s.style.width = '2px'; s.style.height = '2px';
  s.style.opacity=1;
  wrap.appendChild(s);
  gsap.fromTo(s, {x:0, y:0, opacity:1, scale:1}, {duration:1.0, x:window.innerWidth*0.5, y:window.innerHeight*0.2, opacity:0, scale:4, ease:'expo.out', onComplete:()=>s.remove()});
}

/* ---------------------------
   Canvas 粒子初始化（烟雾/花瓣/星光）
   --------------------------- */
function initCanvas(){
  const c = document.getElementById('effects');
  state.canvas = c;
  function resize(){ c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio; c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px'; state.ctx = c.getContext('2d'); state.ctx.scale(devicePixelRatio, devicePixelRatio); }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);
}

/* 粒子结构：
   {x,y,vx,vy,size,life,type,color,alpha}
*/
function spawnParticle(opts){
  const p = Object.assign({
    x: innerWidth/2, y: innerHeight/2, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2 - 1,
    size: Math.random()*6+2, life: 60 + Math.random()*80, type:'spark', color:'#fff', alpha:1
  }, opts);
  state.particles.push(p);
}

/* 每帧渲染 */
function loop(){
  const ctx = state.ctx;
  if(!ctx) return requestAnimationFrame(loop);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  // 简单背景光晕
  // render particles
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += (p.type==='petal'?0.02:0.06);
    p.life--;
    if(p.type==='smoke') { p.alpha *= 0.995; p.size *= 1.002; }
    // draw
    ctx.save();
    ctx.globalAlpha = Math.max(0, (p.life/120)) * (p.alpha||1);
    if(p.type==='spark'){
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2);
      g.addColorStop(0,p.color);
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    } else if(p.type==='smoke'){
      ctx.fillStyle = 'rgba(200,200,200,0.08)';
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.size*2,p.size,0,0,Math.PI*2); ctx.fill();
    } else if(p.type==='petal'){
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size*1.4, p.size*0.9, Math.sin(p.x*0.01), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    if(p.life <= 0 || p.y > innerHeight+50 || p.alpha<0.02) state.particles.splice(i,1);
  }
  requestAnimationFrame(loop);
}

/* ---------------------------
   Web Audio: 合成音效与背景音乐
   - 使用 WebAudio 合成吹气、咚、吃、烟花等短效果
   - 背景音乐为循环 pad（轻柔）和侧链延迟实现“高潮”
   --------------------------- */
const AudioEngine = (function(){
  let ctx, master, musicGain, started=false, compressor;
  function ensure(){
    if(ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.0; musicGain.connect(master);
    // simple reverb: convolver could be used, but keep minimal; we use delay for space
  }

  function resumeOnFirstInteraction(){
    if(started) return;
    ensure();
    ctx.resume();
    started=true;
  }

  // 背景 pad 循环
  let padNodes = [];
  function startPad(){
    ensure();
    if(padNodes.length) return;
    // 创建两个低频振荡器叠加
    const o1 = ctx.createOscillator(); o1.type='sine'; o1.frequency.value = 110; // A2
    const o2 = ctx.createOscillator(); o2.type='sine'; o2.frequency.value = 220; // A3
    const g1 = ctx.createGain(); g1.gain.value = 0.0;
    const g2 = ctx.createGain(); g2.gain.value = 0.0;
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = 600;
    o1.connect(g1); o2.connect(g2); g1.connect(filter); g2.connect(filter); filter.connect(musicGain);
    o1.start(); o2.start();
    // ramp in
    g1.gain.linearRampToValueAtTime(0.04, ctx.currentTime+1.6);
    g2.gain.linearRampToValueAtTime(0.02, ctx.currentTime+1.6);
    musicGain.gain.linearRampToValueAtTime(0.6, ctx.currentTime+2.0);
    padNodes = [o1,o2,g1,g2,filter];
  }

  function crescendo(){
    if(!ctx) return;
    musicGain.gain.cancelScheduledValues(ctx.currentTime);
    musicGain.gain.linearRampToValueAtTime(1.0, ctx.currentTime+1.8);
  }
  function soften(){
    if(!ctx) return;
    musicGain.gain.linearRampToValueAtTime(0.5, ctx.currentTime+1.2);
  }

  // 短效果：click
  function click(){
    ensure();
    const o = ctx.createOscillator(); o.type='triangle'; o.frequency.value = 880;
    const g = ctx.createGain(); g.gain.value = 0.0001;
    o.connect(g); g.connect(master);
    g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.18);
    o.start(); o.stop(ctx.currentTime+0.2);
  }

  // 吹气音效（噪声 + lowpass envelope）
  function blow(){
    ensure();
    const duration=0.9;
    const bufferSize = ctx.sampleRate * duration;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(bufferSize*0.8));
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer;
    const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = 1200;
    const g = ctx.createGain(); g.gain.value = 0.0001;
    src.connect(filter); filter.connect(g); g.connect(master);
    g.gain.linearRampToValueAtTime(0.15, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+duration);
    src.start(); src.stop(ctx.currentTime+duration+0.1);
  }

  // candle out pop (short)
  function pop(){
    ensure();
    const o = ctx.createOscillator(); o.type='sine';
    o.frequency.value = 450;
    const g = ctx.createGain(); g.gain.value=0.0001;
    o.connect(g); g.connect(master);
    g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.28);
    o.start(); o.stop(ctx.currentTime+0.3);
  }

  // chew "啊呜"
  function chew(){
    ensure();
    const o = ctx.createOscillator(); o.type='sawtooth';
    o.frequency.value = 300;
    const g = ctx.createGain(); g.gain.value=0.0001;
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=800;
    o.connect(f); f.connect(g); g.connect(master);
    g.gain.linearRampToValueAtTime(0.08, ctx.currentTime+0.08);
    g.gain.linearRampToValueAtTime(0.02, ctx.currentTime+0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.8);
    o.start(); o.stop(ctx.currentTime+1.0);
  }

  // fireworks (multiple shots)
  function fireworks(){
    ensure();
    for(let i=0;i<10;i++){
      setTimeout(()=>{
        const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = 300 + Math.random()*900;
        const g = ctx.createGain(); g.gain.value=0.0001;
        o.connect(g); g.connect(master);
        g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.5);
        o.start(); o.stop(ctx.currentTime+0.6);
      }, i*90);
    }
  }

  return { resumeOnFirstInteraction, startPad, crescendo, soften, click, blow, pop, chew, fireworks };
})();

/* ---------------------------
   拖拽实现（手写惯性）
   - 支持触摸/鼠标
   - 拖拽 Girl 的逻辑：当靠近蜡烛或蛋糕时触发相应事件
   --------------------------- */
function enableDrag(){
  // 计算Girl的初始位置
  const rect = girl.getBoundingClientRect();
  state.girlPos.x = rect.left;
  state.girlPos.y = rect.top;
  gsap.set(girl, { x: state.girlPos.x, y: state.girlPos.y, scale:1 });

  let pointerId = null;
  let offset = { x:0, y:0 };
  let last = { x:0, y:0, t:0 };

  function start(e){
    e.preventDefault();
    AudioEngine.resumeOnFirstInteraction();
    state.dragging = true;
    girl.classList.add('dragging');
    const p = getPoint(e);
    pointerId = e.pointerId || 'touch';
    offset.x = p.x - state.girlPos.x;
    offset.y = p.y - state.girlPos.y;
    last.x = p.x; last.y = p.y; last.t = Date.now();
    state.velocity.x = 0; state.velocity.y = 0;
  }
  function move(e){
    if(!state.dragging) return;
    const p = getPoint(e);
    const nx = p.x - offset.x;
    const ny = p.y - offset.y;
    // 更新位置限制在屏幕范围
    const minY = window.innerHeight*0.05;
    const maxY = window.innerHeight*0.62;
    const minX = 6;
    const maxX = window.innerWidth - 130;
    const clampedX = Math.min(maxX, Math.max(minX, nx));
    const clampedY = Math.min(maxY, Math.max(minY, ny));
    state.girlPos.x = clampedX; state.girlPos.y = clampedY;
    gsap.set(girl, { x: clampedX, y: clampedY, rotation: (clampedX-window.innerWidth*0.5)/30 });

    // velocity estimate
    const now = Date.now();
    const dt = Math.max(10, now - last.t);
    state.velocity.x = (p.x - last.x) / dt * 16;
    state.velocity.y = (p.y - last.y) / dt * 16;
    last.x = p.x; last.y = p.y; last.t = now;

    // proximity checks
    checkProximity();
  }
  function end(e){
    state.dragging = false;
    girl.classList.remove('dragging');
    // inertia
    const v = {...state.velocity};
    const decay = 0.94;
    let frame = ()=> {
      v.x *= decay; v.y *= decay;
      state.girlPos.x += v.x; state.girlPos.y += v.y;
      // clamp
      const minY = window.innerHeight*0.05, maxY = window.innerHeight*0.62, minX=6, maxX=window.innerWidth-130;
      state.girlPos.x = Math.min(maxX, Math.max(minX, state.girlPos.x));
      state.girlPos.y = Math.min(maxY, Math.max(minY, state.girlPos.y));
      gsap.set(girl, { x: state.girlPos.x, y: state.girlPos.y, rotation: (state.girlPos.x-window.innerWidth*0.5)/30 });
      // boundary rebound
      if(Math.abs(v.x) + Math.abs(v.y) > 0.6){
        requestAnimationFrame(frame);
      } else {
        // small bounce back to home area
        gsap.to(girl, {duration:0.6, x:state.girlPos.x, y:state.girlPos.y, ease:'elastic.out(0.6,0.6)'});
      }
    };
    requestAnimationFrame(frame);
  }

  function getPoint(e){
    if(e.changedTouches && e.changedTouches.length) {
      return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    } else if(e.touches && e.touches.length){
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else {
      return { x: e.clientX, y: e.clientY };
    }
  }

  // attach listeners to girl for pointer/mouse/touch
  girl.addEventListener('touchstart', start, {passive:false});
  girl.addEventListener('mousedown', start, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mousemove', move, {passive:false});
  window.addEventListener('touchend', end, {passive:false});
  window.addEventListener('mouseup', end, {passive:false});
  // also listen pointer events if supported
  girl.addEventListener('pointerdown', start);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
}

/* ---------------------------
   相互作用判定：靠近蜡烛 -> 吹蜡烛
                靠近蛋糕 -> 吃蛋糕
   --------------------------- */
function checkProximity(){
  // get girl center
  const gRect = girl.getBoundingClientRect();
  const gx = gRect.left + gRect.width/2;
  const gy = gRect.top + gRect.height/2;

  // candle area: compute top of cake/candles position
  const cakeRect = cake.getBoundingClientRect();
  const candleArea = { x: cakeRect.left + cakeRect.width*0.52, y: cakeRect.top + 32, r: 60 };

  const dx = gx - candleArea.x;
  const dy = gy - candleArea.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 70 && state.phase < 3){
    // trigger blow
    triggerBlow();
  }

  // cake eating area (slightly lower)
  const cakeCenter = { x: cakeRect.left + cakeRect.width/2, y: cakeRect.top + cakeRect.height*0.6 };
  const dx2 = gx - cakeCenter.x, dy2 = gy - cakeCenter.y;
  const dist2 = Math.sqrt(dx2*dx2 + dy2*dy2);
  if(dist2 < 90 && state.phase >=3 && state.bites < 3){
    triggerEat();
  }
}

/* ---------------------------
   吹蜡烛流程
   --------------------------- */
let blowInProgress = false;
function triggerBlow(){
  if(blowInProgress) return;
  blowInProgress = true;
  state.phase = 3;
  // 女生做鼓嘴动画：缩放 mouth, hair sway, face lean
  const mouth = document.querySelector('#mouth ellipse');
  // animate mouth scale (做鼓嘴)
  gsap.to(mouth, { duration:0.25, attr:{ rx:4, ry:6 }, yoyo:true, repeat:3, ease:'power1.inOut' });
  // 微微头部前倾
  gsap.to('#girl', { duration:0.6, y: '-=8', x:'-=6', ease:'power2.out', yoyo:true, repeat:1 });

  // 播放吹气音效
  AudioEngine.blow();

  // 让火焰逐个熄灭（GSAP）
  const candles = document.querySelectorAll('.candle .flame');
  let idx = 0;
  function extinguishNext(){
    if(idx >= candles.length){
      // 烟雾与火星粒子
      for(let i=0;i<20;i++){
        spawnParticle({ x: window.innerWidth*0.5 + (Math.random()-0.5)*40, y: window.innerHeight*0.28 + Math.random()*10, vx:(Math.random()-0.5)*1.8, vy:-Math.random()*1.6-0.6, size:6+Math.random()*6, life:80 + Math.random()*40, type:'smoke', alpha:0.55 })
      }
      AudioEngine.pop(); // pop final
      // trigger sky fireworks after short delay
      setTimeout(()=>{
        AudioEngine.fireworks();
        spawnFireworksVisual();
        AudioEngine.crescendo();
        state.phase = 3; // remain in blow state but allowed to eat
      }, 900);
      blowInProgress=false;
      return;
    }
    const f = candles[idx];
    // flame shrink and fade
    gsap.to(f, { duration:0.42, scale:0.2, opacity:0, transformOrigin:'50% 50%', ease:'power2.out', onComplete:()=>{
      // tiny spark particle
      for(let j=0;j<6;j++){
        spawnParticle({ x: window.innerWidth*0.5 + (Math.random()-0.5)*40, y: window.innerHeight*0.28, vx:(Math.random()-0.5)*2.6, vy:-Math.random()*1.4, size:4+Math.random()*4, life:40+Math.random()*60, type:'spark', color:'#ffd88a' });
      }
      idx++; extinguishNext();
    }});
  }
  extinguishNext();
}

/* ---------------------------
   吃蛋糕流程：三口
   - 使用 mask 或 scale 来“减少”cake
   - 每口触发碎屑粒子与音效
   --------------------------- */
function triggerEat(){
  if(state.biteLock) return;
  state.biteLock = true;
  state.bites++;
  state.phase = 4;
  AudioEngine.chew();
  // 生成碎屑与小星星
  for(let i=0;i<14;i++){
    spawnParticle({ x: window.innerWidth*0.5 + (Math.random()-0.5)*80, y: window.innerHeight*0.42 - Math.random()*20, vx:(Math.random()-0.5)*3, vy:-Math.random()*2, size:3+Math.random()*4, life:40+Math.random()*60, type: Math.random()>0.6?'petal':'spark', color: Math.random()>0.5? '#fff7f3':'#ffd88a' });
  }
  // mask-like effect: scale cake down a bit and clip
  const scaleDown = 0.92 - state.bites*0.06;
  gsap.to(cake, { duration:0.9, scale: Math.max(0.6, scaleDown), y: "+=6", ease:'power2.inOut', onComplete:()=>{
    state.biteLock = false;
    // if finished all bites, reveal envelope gradually
    if(state.bites >=3){
      revealEnvelope();
    }
  }});
}

/* ---------------------------
   页面交互控制（上滑触发主时间线）
   - 监听 touchstart/touchmove 上滑距离
   --------------------------- */
let touchStartY = null;
function setupSwipeToStart(){
  window.addEventListener('touchstart', (e)=>{ touchStartY = e.touches[0].clientY; AudioEngine.resumeOnFirstInteraction(); }, {passive:true});
  window.addEventListener('touchmove', (e)=>{
    if(touchStartY === null) return;
    const dy = touchStartY - e.touches[0].clientY;
    if(dy > 40 && !state.started){
      startMain();
      touchStartY = null;
    }
  }, {passive:true});

  // 也支持箭头点击
  document.querySelectorAll('.arrow-bob').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); startMain(); });
  });
}

/* startMain 启动序列 */
function startMain(){
  if(state.started) return;
  state.started = true;
  AudioEngine.resumeOnFirstInteraction();
  createStars(96);
  initCanvas();
  setupTimelines();
  mainTL.play();
  // 点击后允许背景音乐
  AudioEngine.startPad();
  // 禁用 intro 指示部件交互
  introEl.style.pointerEvents='none';
}

/* ---------------------------
   Page 初始设置，事件绑定
   --------------------------- */
(function init(){
  // create initial stars but keep intro visible
  createStars(60);
  // bind swipe
  setupSwipeToStart();

  // 禁止默认长按菜单
  window.addEventListener('contextmenu', e=>e.preventDefault());
  // 防止双击放大
  let lastTouch = 0;
  window.addEventListener('touchstart', function(e){
    const t = Date.now();
    if(t - lastTouch < 300) e.preventDefault();
    lastTouch = t;
  }, {passive:false});

  // envelope click: allow from overlay (but ensure plate click triggers zoom first)
  envelopeWrap.addEventListener('click', (e)=>{ e.stopPropagation(); if(state.envelopeShown) openEnvelopeOnce(); }, {passive:true});

  // 初始化canvas particle loop will run when initCanvas called
})();
</script>
